[build]
  base = "dashboard"
  command = "npm run build"
  publish = "dashboard/dist"

# Set VITE_API_URL to your production API server URL in Netlify dashboard.
# Example: https://your-api-server.com
# VITE_WS_URL can be set for the WebSocket server if different from the API URL.

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
